<!doctype html>
<html>
    <head>
        <title>Edit Patient</title>
        <link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}">
    </head>
    <body>

        <h1>Edit Patient</h1>

        <form method="POST" enctype="multipart/form-data">
            
            <label>Name</label><br>
            <input type="text" name="name" value="{{ patient[1] }}"><br><br>

            <label>Age</label><br>
            <input type="number" name="age" value="{{ patient[2] }}"><br><br>

            <label>Gender</label><br>
            <input type="text" name="gender" value="{{ patient[3] }}"><br><br>

            <label>Phone</label><br>
            <input type="text" name="phone" value="{{ patient[4] }}"><br><br>

            <label>Disease</label><br>
            <input type="text" name="disease" value="{{ patient[5] }}"><br><br>

            <label>Current Photo</label><br>

            {% if patient[6] %}
                <img src="{{ url_for('static', filename='uploads/' + patient[6]) }}"
                width="100"
                height="100"
                style="border-radius:50%; object-fit:cover;"><br><br>
            {% else %}
                <p>No Photo</p>
            {% endif %}

<label>Change Photo</label><br>
<input type="file" name="photo" accept="image/*"><br><br>

            <button type="submit">Update Patient</button>

        </form>
    </body>
</html>
